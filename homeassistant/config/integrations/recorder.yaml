#
# Recorder
#
# https://www.home-assistant.io/integrations/recorder/
#

recorder:
  db_url: !secret mariadb_url
  purge_keep_days: 30
  commit_interval: 20
  exclude:
    domains:
      - automation
    entities:
      - sensor.last_boot
      - sensor.date
    entity_globs:
      - device_tracker.*
      - binary_sensor.*_occupancy
