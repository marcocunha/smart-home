id: delete_cameras_snapshots
alias: Delete snapshot cameras
triggers:
  - trigger: homeassistant
    event: start
  - trigger: time_pattern
    hours: "7"
    minutes: "0"
    seconds: "0"
actions:
  - action: delete.files_in_folder
    data:
      folder: "/config/www/doorbell/"
      time: 604800 # older than a week
      only_extensions:
        - ".png"
        - ".jpg"
  - action: delete.files_in_folder
    data:
      folder: "/media/llmvision/alerts/"
      time: 604800 # older than a week
      only_extensions:
        - ".jpg"
