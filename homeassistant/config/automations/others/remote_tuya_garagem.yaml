id: remote_tuya_garagem
alias: Garage remote (Tuya) buttons
description: Button 1 toggles the garage, button 2 opens it and closes it after 30 seconds, button 3 toggles the gate.
mode: parallel
max: 3
max_exceeded: silent
triggers:
  - trigger: device
    domain: mqtt
    device_id: 149b39eaad8da492f392577d03198112
    type: action
    subtype: 1_single
    discovery_id: 0xa4c1387d28db6c69 action_1_single
    id: toggle_garage
  - trigger: device
    domain: mqtt
    device_id: 149b39eaad8da492f392577d03198112
    type: action
    subtype: 2_single
    id: open_and_close_garage
  - trigger: device
    domain: mqtt
    device_id: 149b39eaad8da492f392577d03198112
    type: action
    subtype: 3_single
    id: toggle_gate
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: toggle_garage
        sequence:
          - action: script.garage
      - conditions:
          - condition: trigger
            id: open_and_close_garage
        sequence:
          - alias: Open garage door
            action: script.garage
          - delay:
              seconds: 30
          - alias: Close garage door
            action: script.garage
      - conditions:
          - condition: trigger
            id: toggle_gate
        sequence:
          - action: cover.toggle
            target:
              entity_id: cover.portao_exterior
