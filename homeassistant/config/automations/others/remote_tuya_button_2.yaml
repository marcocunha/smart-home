id: remote_tuya_button_2
alias: Open and close garage using remote.tuya.garagem button 2
mode: single
triggers:
  - trigger: device
    domain: mqtt
    device_id: 149b39eaad8da492f392577d03198112
    type: action
    subtype: 2_single
actions:
  - action: script.garage
    alias: Open garage door
  - delay:
      hours: 0
      minutes: 0
      seconds: 30
      milliseconds: 0
  - action: script.garage
    alias: Close garage door
