id: holiday_arm_alarm
alias: "Holiday: arm the alarm"
description: >-
  Arms the alarm when holiday mode is turned on with an empty house, or when the last person leaves afterwards.
  It only reacts to those two moments, so it never arms again over someone who disarmed it by hand.
mode: single
triggers:
  - trigger: state
    entity_id: input_boolean.holiday_mode
    from: "off"
    to: "on"
  - trigger: state
    entity_id: binary_sensor.anyone_home
    from: "on"
    to: "off"
conditions:
  - condition: state
    entity_id: input_boolean.holiday_mode
    state: "on"
  - condition: state
    entity_id: binary_sensor.anyone_home
    state: "off"
  - condition: state
    entity_id: alarm_control_panel.casa
    state: disarmed
actions:
  - alias: "Arm alarm"
    continue_on_error: true
    action: alarm_control_panel.alarm_arm_away
    target:
      entity_id: alarm_control_panel.casa
  - alias: "Wait for the alarm to leave disarmed"
    wait_template: "{{ not is_state('alarm_control_panel.casa', 'disarmed') }}"
    timeout:
      seconds: 10
    continue_on_timeout: true
  - alias: "Notify if the alarm could not be armed"
    if:
      - condition: state
        entity_id: alarm_control_panel.casa
        state: disarmed
    then:
      - action: notify.ha_mobile_apps
        data:
          title: Alarme
          message: Não foi possível armar o alarme. Verifica se há janelas ou portas abertas.
          data:
            tag: alarm_arm_failed
            ttl: 0
            priority: high
