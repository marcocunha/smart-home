id: motion_detected_garage
alias: Motion detected - Garage
mode: single
max_exceeded: silent
triggers:
  - trigger: state
    entity_id: binary_sensor.dvr_camera_garagem_motion_alarm_2
    from: "off"
    to: "on"
    for: "00:00:02"
conditions:
  - condition: or
    conditions:
      - condition: state
        entity_id: binary_sensor.anyone_home
        state: "off"
      - condition: state
        entity_id: alarm_control_panel.ajax_security_system
        state: armed_home
actions:
  - action: script.security_camera_alert
    data:
      camera_entity: camera.dvr_camera_garagem_main_2
  - alias: Wait before alerting again
    delay:
      minutes: 3
