id: doorbell_ring
alias: Doorbell ring - Notify tablets
mode: single
max_exceeded: silent
variables:
  tablets:
    - samsung_tab_s_10_5
triggers:
  - trigger: event.received
    target:
      entity_id: event.welcomeeye_doorbell_ring
    options:
      event_type:
        - ring
conditions:
  - condition: state
    entity_id: binary_sensor.anyone_home
    state: "on"
actions:
  - alias: Forget who answered the previous ring
    action: input_text.set_value
    target:
      entity_id: input_text.doorbell_answered_by
    data:
      value: ""
  - alias: Notify and open the answer page on every tablet
    repeat:
      for_each: "{{ tablets }}"
      sequence:
        - action: "esphome.ks_{{ repeat.item }}_notification"
          data:
            title: Campainha
            message: Alguém está à porta
            duration: 10
            type: info
            chime: true
            scale: 1
            icon: mdi:doorbell
            chime_file: ""
            volume: 0
            image: ""
        - action: "esphome.ks_{{ repeat.item }}_open_url"
          data:
            url: "http://192.168.1.232:8123/doorbell-dashboard/{{ repeat.item }}"
            hold_mode: false
