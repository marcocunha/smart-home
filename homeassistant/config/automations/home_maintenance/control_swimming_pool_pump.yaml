id: control_swimming_pool_pump
alias: Control swimming pool pump
description: >-
  The schedule always has priority: while it is ON the pump runs. While it is
  OFF the pump only runs on surplus energy production (after 08:00) and stops
  when the production is no longer enough.
mode: single
max_exceeded: silent
variables:
  send_notification: false
  notification_title: Bomba da Piscina
  persistent_notification: false
triggers:
  - trigger: state
    entity_id: schedule.swimming_pool_pump_schedule
  - trigger: numeric_state
    entity_id: sensor.energy_consumption_mean_over_last_10_minutes
    above: -300
    alias: Not enough energy to have the swimming pool pump working
  - trigger: time_pattern
    minutes: /10
actions:
  - choose:
      - alias: Schedule is ON, pump must run
        conditions:
          - condition: state
            entity_id: schedule.swimming_pool_pump_schedule
            state: "on"
          - condition: state
            entity_id: switch.bomba_piscina_switch_0
            state: "off"
        sequence:
          - alias: Turn on pump
            action: switch.turn_on
            target:
              entity_id: switch.bomba_piscina_switch_0
          - if: "{{ send_notification }}"
            then:
              - alias: Inform swimming pool pump was turned on by the schedule
                action: notify.ha_mobile_apps
                data:
                  title: "{{ notification_title }}"
                  message: Bomba da piscina ligada (horário)
                  data:
                    tag: "{{ notification_title }}"
                    persistent: "{{ persistent_notification }}"
                    ttl: 0
                    priority: high
      - alias: Schedule is OFF and there is surplus energy
        conditions:
          - condition: state
            entity_id: schedule.swimming_pool_pump_schedule
            state: "off"
          - condition: state
            entity_id: switch.bomba_piscina_switch_0
            state: "off"
          - condition: numeric_state
            entity_id: sensor.average_consumption_inc_pool_pump
            below: -150
            alias: Enough energy to have the swimming pool pump working
          - condition: time
            after: "08:00:00"
        sequence:
          - alias: Turn on pump
            action: switch.turn_on
            target:
              entity_id: switch.bomba_piscina_switch_0
          - if: "{{ send_notification }}"
            then:
              - alias: Inform swimming pool pump was turned on by surplus energy
                action: notify.ha_mobile_apps
                data:
                  title: "{{ notification_title }}"
                  message: Bomba da piscina ligada (excedente de energia)
                  data:
                    tag: "{{ notification_title }}"
                    persistent: "{{ persistent_notification }}"
                    ttl: 0
                    priority: high
      - alias: Schedule is OFF and energy is not enough
        conditions:
          - condition: state
            entity_id: schedule.swimming_pool_pump_schedule
            state: "off"
          - condition: state
            entity_id: switch.bomba_piscina_switch_0
            state: "on"
          - condition: numeric_state
            entity_id: sensor.energy_consumption_mean_over_last_10_minutes
            above: -150
            alias: Not enough power for the swimming pool pump
        sequence:
          - alias: Turn off pump
            action: switch.turn_off
            target:
              entity_id: switch.bomba_piscina_switch_0
          - if: "{{ send_notification }}"
            then:
              - alias: Inform swimming pool pump was turned off due to energy usage
                action: notify.ha_mobile_apps
                data:
                  title: "{{ notification_title }}"
                  message: >-
                    Produção demasiado baixa, consumo:
                    {{ states('sensor.energy_consumption_mean_over_last_10_minutes') }}W.
                    Desligada automaticamente.
                  data:
                    tag: "{{ notification_title }}"
                    persistent: "{{ persistent_notification }}"
                    ttl: 0
                    priority: high
