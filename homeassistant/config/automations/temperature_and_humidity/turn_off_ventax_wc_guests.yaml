id: turn_off_ventax_wc_guests
alias: Turn off ventax if humitidy of WC Guests is normal
mode: restart
max_exceeded: silent
variables:
  notification_title: Humidade WC Serviço
  persistent_notification: false
  send_notification: false
triggers:
  - trigger: template
    value_template: >-
      {{ states('sensor.sensor_temperature_humidity_wc_servico_humidity') | float(0) <
      states('input_number.bathroom_max_humidity_percentage') | float(0) }}
    for:
      hours: 0
      minutes: 10
      seconds: 0
  - trigger: time_pattern
    minutes: /20
conditions:
  - alias: "DND is enabled or the humidity is at a normal level"
    or:
      - condition: state
        entity_id: schedule.dnd_schedule
        state: "on"
        alias: "DND is enabled"
      - and:
        - condition: template
          value_template: |-
            {{ states('sensor.sensor_temperature_humidity_wc_servico_humidity') | float(0)<
                  states('input_number.bathroom_max_humidity_percentage') | float(0) }}
        - condition: state
          entity_id: fan.multiswitch_wc_guests_center
          state: "on"
actions:
  - alias: Set up variables for the actions
    variables:
      action_ack: "{{ 'ACK_' ~ context.id }}"
      message: "{{ 'Humidade na WC Serviço normal: ' ~ states('sensor.sensor_temperature_humidity_wc_servico_humidity')  ~ '%. Ventilação desligada.'}}"
  - if: "{{ send_notification == true }}"
    then:
      - alias: Send notification
        action: notify.ha_mobile_apps
        data:
          title: "{{ notification_title }}"
          message: "{{ message }}"
          data:
            tag: "{{ notification_title }}"
            persistent: "{{ persistent_notification }}"
            ttl: 0
            priority: high
  - alias: Perform the action
    action: fan.turn_off
    target:
      entity_id: fan.multiswitch_wc_guests_center
