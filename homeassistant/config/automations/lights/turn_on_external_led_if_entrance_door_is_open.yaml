id: turn_on_external_led_if_entrance_door_is_open
alias: Turn on external led if entrance door is open
mode: single
triggers:
  - trigger: door.opened
    target:
      entity_id: binary_sensor.casa_porta_principal_door
    options:
      behavior: each
      for: "00:00:00"
    alias: "Entrance door opened"
conditions:
  - condition: sun
    after: sunset
    before: sunrise
actions:
  - action: script.turn_on_exterior_led
    data:
      duration: 15
