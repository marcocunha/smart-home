# Learn more at https://home-assistant.io/docs/configuration/secrets/
# Copy to secrets.yaml and replace the values. CI copies this file as-is to run
# check_config, so every value must stay valid for the option that reads it.

# Core (configuration.yaml)
ha_name: Home
ha_unit_system: metric
ha_currency: EUR
ha_latitude: 38.5
ha_longitude: -9.0
ha_country: PT
external_url: https://smart-home.domain.com
internal_url: http://192.168.1.2:8123
ha_allowlist_external_urls:
  - https://smart-home.domain.com

# Recorder (integrations/recorder.yaml)
mariadb_url: mysql://user:password@192.168.1.2:3306/homeassistant?charset=utf8mb4

# REST commands (integrations/rest_commands.yaml)
check_alarm_status_url: http://192.168.1.2/status
wallpanel_command_url: http://192.168.1.2/command

# Constants (integrations/input_number.yaml, integrations/powercalc.yaml)
CONST_SWIMMING_POOL_MINIMUM_DURARTION_HOURS: 6
CONST_MAX_BATHROOM_HUMIDITY: 70
CONST_DESIRED_HOT_WATER_TEMPERATURE: 55
CONST_PRICE_PER_KWH: 0.2
