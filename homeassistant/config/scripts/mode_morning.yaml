mode_morning:
  alias: Set the entities according to the morning mode
  mode: single
  sequence:
    - alias: "Set variables"
      variables:
        active_mode: MORNING
        covers_to_open:
          - cover.curtains_livingroom_right
          - cover.curtains_livingroom_left
          - cover.estores_escritorio
          - cover.estores_lavandaria
          - cover.curtains_kitchen
        curtains_to_open_partially:
          - cover.curtains_guestroom
          - cover.curtains_suite
        desired_position_percentage: 25
        hall_position_percentage: 35
        switches_to_turn_on: []
        lights_to_turn_on: []
        lights_to_turn_off:
          - light.zigbee_smartpowerplug_1 # Luz presença Marco
          - light.candeeiro_ambiente_2 # Candeeiro ambiente
          - light.switch_tomada_poltrona # Luz tomada poltrona
          - light.plug_candeeiro_presenca_hall # Candeeiro presença hall

    - alias: "Set active mode"
      action: input_text.set_value
      data:
        value: "{{ active_mode }}"
      target:
        entity_id: input_text.active_mode

    - alias: "Disarm alarm if someone is home"
      if:
        - condition: state
          entity_id: binary_sensor.anyone_home
          state: "on"
        - condition: not
          conditions:
            - condition: state
              entity_id: alarm_control_panel.casa
              state: disarmed
      then:
        - alias: "Disarm alarm"
          continue_on_error: true
          action: alarm_control_panel.alarm_disarm
          target:
            entity_id: alarm_control_panel.casa

    - alias: "Open covers"
      action: cover.open_cover
      target:
        entity_id: "{{ covers_to_open | default([]) }}"

    - alias: "Set cover position for partial open"
      action: cover.set_cover_position
      data:
        position: "{{ desired_position_percentage }}"
      target:
        entity_id: "{{ curtains_to_open_partially | default([]) }}"

    # Hall and wcsuite motors sometimes ignore the target and run to fully open, and every time
    # they were given a target below their current position they did. So they are only commanded
    # when well below the target, and stopped by the first position report above the threshold
    # (reports come every ~1 s).
    - alias: "Set hall and wcsuite partial position and stop them"
      parallel:
        - if:
            - condition: template
              value_template: "{{ state_attr('cover.curtains_hall', 'current_position') | int(100) < hall_position_percentage - 5 }}"
          then:
            - alias: "Set hall position"
              action: cover.set_cover_position
              data:
                position: "{{ hall_position_percentage }}"
              target:
                entity_id: cover.curtains_hall
            # The cover echoes the target right after the command, which would fire the trigger at once
            - delay:
                milliseconds: 1500
            - alias: "Wait for the hall to pass the threshold"
              wait_for_trigger:
                - trigger: numeric_state
                  entity_id: cover.curtains_hall
                  attribute: current_position
                  above: 32
              timeout:
                seconds: 30
              continue_on_timeout: true
            - if:
                - condition: template
                  value_template: "{{ wait.trigger is not none }}"
              then:
                - alias: "Stop hall"
                  action: cover.stop_cover
                  target:
                    entity_id: cover.curtains_hall
                # A stop can be lost or ignored by the motor (wcsuite, 19 Nov); a stopped cover leaves `opening` within ~0.3 s
                - repeat:
                    count: 2
                    sequence:
                      - delay:
                          milliseconds: 1500
                      - if:
                          - condition: state
                            entity_id: cover.curtains_hall
                            state: opening
                        then:
                          - alias: "Stop hall again"
                            action: cover.stop_cover
                            target:
                              entity_id: cover.curtains_hall
        - if:
            - condition: template
              value_template: "{{ state_attr('cover.curtains_wcsuite', 'current_position') | int(100) < desired_position_percentage - 5 }}"
          then:
            - alias: "Set wcsuite position"
              action: cover.set_cover_position
              data:
                position: "{{ desired_position_percentage }}"
              target:
                entity_id: cover.curtains_wcsuite
            - delay:
                milliseconds: 1500
            - alias: "Wait for the wcsuite to pass the threshold"
              wait_for_trigger:
                - trigger: numeric_state
                  entity_id: cover.curtains_wcsuite
                  attribute: current_position
                  above: 22
              timeout:
                seconds: 30
              continue_on_timeout: true
            - if:
                - condition: template
                  value_template: "{{ wait.trigger is not none }}"
              then:
                - alias: "Stop wcsuite"
                  action: cover.stop_cover
                  target:
                    entity_id: cover.curtains_wcsuite
                - repeat:
                    count: 2
                    sequence:
                      - delay:
                          milliseconds: 1500
                      - if:
                          - condition: state
                            entity_id: cover.curtains_wcsuite
                            state: opening
                        then:
                          - alias: "Stop wcsuite again"
                            action: cover.stop_cover
                            target:
                              entity_id: cover.curtains_wcsuite

    - alias: "Turn ON specified switches"
      action: switch.turn_on
      target:
        entity_id: "{{ switches_to_turn_on | default([]) }}"

    - alias: "Turn ON specified lights"
      action: light.turn_on
      target:
        entity_id: "{{ lights_to_turn_on | default([]) }}"

    - alias: "Turn OFF specified lights"
      action: light.turn_off
      target:
        entity_id: "{{ lights_to_turn_off | default([]) }}"
