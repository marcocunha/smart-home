garage:
  alias: Toggle Garage
  variables:
    message: >-
      {% if is_state('binary_sensor.sensor_garage_door_contact', 'on') %}
        A fechar garagem
      {% else %}
        A abrir garagem
      {% endif %}
  sequence:
    - parallel:
        - alias: Toggle garage button
          service: remote.send_command
          data:
            device: Garage
            command: toggle
            num_repeats: 1
            delay_secs: 0.4
            hold_secs: 0
          target:
            entity_id: remote.broadlink_rm4_pro
        - if:
            - condition: not
              conditions:
                - condition: state
                  entity_id: group.household
                  state: home
              alias: Check if no-one at home
          then:
            - alias: Send notification
              service: script.announcement
              data:
                notify: true
                messages:
                  - "{{ message }}"
                service: notify.all
  icon: mdi:garage-open-variant
  mode: single
